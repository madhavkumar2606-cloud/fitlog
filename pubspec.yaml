name: fitlog
description: Workout tracker + calorie tracker that work together.
publish_to: 'none'
version: 2.7.0+10

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  fl_chart: ^0.69.0
  http: ^1.2.2
  supabase_flutter: ^2.18.2
  shared_preferences: ^2.3.0
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
        - asset: assets/fonts/InstrumentSerif-Italic.ttf
          style: italic
    - family: InterTight
      fonts:
        - asset: assets/fonts/InterTight-300.ttf
          weight: 300
        - asset: assets/fonts/InterTight-400.ttf
          weight: 400
        - asset: assets/fonts/InterTight-500.ttf
          weight: 500
        - asset: assets/fonts/InterTight-600.ttf
          weight: 600
        - asset: assets/fonts/InterTight-700.ttf
          weight: 700
