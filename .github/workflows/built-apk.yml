name: Build APK

# Runs when you push a version tag like v2.0.0, or manually from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true

      # Supabase settings come from repository secrets (Settings > Secrets and variables > Actions).
      - name: Write env.json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python3 -c "import json, os; json.dump({'SUPABASE_URL': os.environ.get('SUPABASE_URL', ''), 'SUPABASE_KEY': os.environ.get('SUPABASE_KEY', '')}, open('env.json', 'w'))"

      # Optional: permanent signing key so updates install over the old version.
      - name: Set up signing key
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=upload\nstoreFile=upload-keystore.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/key.properties

      - run: flutter pub get

      - run: flutter build apk --release --dart-define-from-file=env.json

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk FitLog.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FitLog-apk
          path: FitLog.apk

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: FitLog.apk
          generate_release_notes: true
